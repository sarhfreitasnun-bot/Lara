<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lara ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #090609;
    color: #f8edf3;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 70, 140, .10), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(120, 50, 150, .10), transparent 30%);
    z-index: -1;
}

/* CORAÇÕES */

.heart {
    position: fixed;
    bottom: -20px;
    font-size: 16px;
    opacity: .5;
    animation: subir 8s linear infinite;
    pointer-events: none;
    z-index: 5;
}

@keyframes subir {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: .6;
    }
    100% {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}

/* CAPA */

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    position: relative;
    background:
        linear-gradient(rgba(9,6,9,.25), rgba(9,6,9,.9)),
        radial-gradient(circle, #54233e 0%, #180b15 45%, #090609 100%);
}

.hero-small {
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .65;
    margin-bottom: 25px;
}

.hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(75px, 22vw, 170px);
    font-weight: 400;
    line-height: .8;
    font-style: italic;
}

.hero-subtitle {
    margin-top: 35px;
    max-width: 500px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    line-height: 1.5;
    opacity: .9;
}

.enter {
    margin-top: 50px;
    padding: 15px 28px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 50px;
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: .3s;
}

.enter:hover {
    background: white;
    color: #120912;
}

/* SEÇÕES */

section {
    max-width: 850px;
    margin: auto;
    padding: 110px 25px;
}

.chapter {
    text-align: center;
    margin-bottom: 55px;
}

.chapter-number {
    font-size: 10px;
    letter-spacing: 5px;
    opacity: .45;
    text-transform: uppercase;
}

.chapter h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 11vw, 75px);
    font-weight: 400;
    font-style: italic;
    margin-top: 12px;
}

.chapter-line {
    width: 45px;
    height: 1px;
    background: rgba(255,255,255,.4);
    margin: 25px auto;
}

.text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 23px;
    line-height: 1.65;
    color: #eadde5;
}

.text p {
    margin-bottom: 25px;
}

.quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 35px;
    font-style: italic;
    text-align: center;
    margin: 60px 0;
    color: #fff;
}

.highlight {
    color: #ffb1d0;
}

/* REENCONTRO */

.reunion {
    text-align: center;
    padding: 100px 25px;
    background:
        linear-gradient(135deg, rgba(255,80,150,.08), rgba(100,40,130,.08));
    border-top: 1px solid rgba(255,255,255,.08);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.years {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin: 50px 0;
}

.age {
    font-family: 'Cormorant Garamond', serif;
    font-size: 70px;
}

.arrow {
    font-size: 25px;
    opacity: .4;
}

.twelve {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .6;
}

/* FOTOS */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.photo {
    aspect-ratio: 1 / 1.25;
    overflow: hidden;
    border-radius: 5px;
    background: linear-gradient(145deg, #321522, #170d15);
    position: relative;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .6s ease;
}

.photo:hover img {
    transform: scale(1.05);
}

.photo.big {
    grid-column: span 2;
    aspect-ratio: 16 / 10;
}

/* MOMENTOS */

.moment {
    border-left: 1px solid rgba(255,177,208,.4);
    padding-left: 25px;
    margin: 50px 0;
}

.moment h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 500;
    margin-bottom: 10px;
}

.moment p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    line-height: 1.6;
    opacity: .8;
}

/* MÚSICA */

.music {
    text-align: center;
    padding: 100px 25px;
    background: radial-gradient(circle, #321323, #090609 70%);
}

.music-note {
    font-size: 40px;
    margin-bottom: 20px;
}

.music h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 55px;
    font-weight: 400;
    font-style: italic;
}

.music p {
    margin: 15px auto 35px;
    opacity: .65;
    font-size: 13px;
}

.music-button {
    display: inline-block;
    padding: 16px 30px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* FINAL */

.final {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background:
        radial-gradient(circle at center, #51233e, #160b14 45%, #090609 80%);
}

    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .5;
    margin
